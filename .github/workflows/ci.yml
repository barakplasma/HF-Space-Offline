name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check hf_offline/
      - run: pytest -q

  helm-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v5
      - run: pip install -e .
      # Generate a chart from a fixture-free path: tests build charts too, but only helm can validate the Go templates.
      - run: |
          python - <<'PY'
          from pathlib import Path
          from hf_offline.helm import generate_chart
          from hf_offline.space import SpaceInfo
          generate_chart(SpaceInfo(space_id="o/s", owner="o", name="s", sdk="gradio"),
                         Path("out"), model_ids=["org/model"], s3_endpoint="http://minio:9000",
                         env={"A": "1"})
          PY
      - run: helm lint out/chart
      - run: helm template t out/chart --set hfToken=x | grep -q HF_HUB_OFFLINE
      - run: helm lint out/chart -f out/chart/values-openshift.yaml
      - run: |
          helm template t out/chart -f out/chart/values-openshift.yaml | grep -q "kind: Route"
